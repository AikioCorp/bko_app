name: bko_app
description: "Application Mobile Officielle Bko Podcast - Les voix du Mali et de l'Afrique"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  go_router: ^14.0.0
  just_audio: ^0.9.38
  audio_service: ^0.18.15
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.4
  share_plus: ^7.2.2
  youtube_player_iframe: ^5.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/brand/
